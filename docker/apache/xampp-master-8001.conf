# XAMPP Apache — Master portal on port 8001 (when NOT using Docker master).
#
# Install:
#   1. Copy this file into XAMPP:
#        cp docker/apache/xampp-master-8001.conf /Applications/XAMPP/xamppfiles/etc/extra/b2b-master.conf
#      Linux: /opt/lampp/etc/extra/b2b-master.conf
#   2. Edit MASTER_ROOT below to your b2b-master-datamanagement path.
#   3. Add to httpd.conf (once):
#        Include etc/extra/b2b-master.conf
#   4. Restart Apache from XAMPP control panel.
#
# If you use Docker master instead, do NOT use this — stop XAMPP on :8001 and run:
#   cd B2B_CRM && ./docker/scripts/compose.sh up -d master

Listen 8001

<VirtualHost *:8001>
    ServerName localhost
    DocumentRoot "/Users/himmat/Documents/GitHub/b2b-master-datamanagement/public"

    <Directory "/Users/himmat/Documents/GitHub/b2b-master-datamanagement/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/b2b-master-error_log"
    CustomLog "logs/b2b-master-access_log" common
</VirtualHost>
